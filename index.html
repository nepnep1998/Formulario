<script>
// Máscara para telefone
document.getElementById('phone').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (value.length <= 11) {
        value = value.replace(/(\d{2})(\d)/, '($1) $2');
        value = value.replace(/(\d{5})(\d)/, '$1-$2');
        e.target.value = value;
    }
});

// 🟡 CORREÇÃO: Envio melhorado com tratamento de erro
document.getElementById('contactForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const button = this.querySelector('button[type="submit"]');
    const originalText = button.textContent;
    
    button.textContent = 'Enviando...';
    button.disabled = true;

    try {
        const formData = new FormData(this);
        
        // SUA URL DO GOOGLE APPS SCRIPT
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz2xfQlXCP4vGYwjV55qHG7p4W7jJVjDwtpz1juUy_SkY3Hyvl0_zbFc_yqKydihLk89g/exec';
        
        // Codificar dados como parâmetros URL
        const params = new URLSearchParams();
        params.append('name', formData.get('name'));
        params.append('phone', formData.get('phone'));
        params.append('email', formData.get('email'));
        params.append('help', formData.get('help'));
        params.append('description_accurate', formData.get('description_accurate'));
        
        // 🟡 MÉTODO MELHOR: Usar fetch com tratamento de resposta
        const response = await fetch(scriptURL + '?' + params.toString(), {
            method: 'GET',
            mode: 'no-cors' // Importante para evitar problemas de CORS
        });
        
        // Com no-cors não podemos ler a resposta, mas assumimos sucesso
        showMessage('✅ Mensagem enviada com sucesso! Entraremos em contato em breve.', 'success');
        document.getElementById('contactForm').reset();
        
    } catch (error) {
        console.error('Erro:', error);
        showMessage('❌ Erro ao enviar mensagem. Tente novamente.', 'error');
    } finally {
        button.textContent = originalText;
        button.disabled = false;
    }
});

function showMessage(text, type) {
    const messageDiv = document.getElementById('message');
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + type;
    messageDiv.style.display = 'block';
    
    setTimeout(function() {
        messageDiv.style.display = 'none';
    }, 5000);
}

// 🟡 ADICIONAR: Função para testar a conexão
async function testConnection() {
    try {
        const testURL = 'https://script.google.com/macros/s/AKfycbz2xfQlXCP4vGYwjV55qHG7p4W7jJVjDwtpz1juUy_SkY3Hyvl0_zbFc_yqKydihLk89g/exec?test=1';
        const response = await fetch(testURL, { method: 'GET', mode: 'no-cors' });
        console.log('✅ Conexão com Google Apps Script: OK');
        return true;
    } catch (error) {
        console.error('❌ Conexão com Google Apps Script: FALHA', error);
        return false;
    }
}

// Testar conexão quando a página carregar
window.addEventListener('load', testConnection);
</script>
